[project]
name = "sam3-text-masking"
version = "0.1.0"
description = "A small SAM 3 text-prompt masking playground for local images."
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.7.1",
    "torchvision==0.22.1",
    "transformers>=5.0,<6",
    "huggingface-hub>=1,<2",
    "numpy>=1.26,<3",
    "pillow>=10,<13",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[tool.uv]
environments = ["sys_platform == 'linux'"]
